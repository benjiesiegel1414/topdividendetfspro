<!doctype html>
<!-- Black Friday social card. Edit this file and the "Social cards" workflow renders it to /img/blackfriday-social-card.png --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Lato:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;font-family:Inter,sans-serif}
.c{width:1200px;height:630px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 80% 40%,#16352c,#050505 65%)}
.brand{position:absolute;left:54px;bottom:40px;display:flex;align-items:center;gap:12px;font:900 26px Lato,sans-serif}.brand i{font-style:normal;color:#7FD1B9}.brand svg{height:30px}
.y{color:#FFD23F}
.pill{display:inline-block;background:#FFD23F;color:#111;font-weight:900;border-radius:999px;padding:10px 22px;font-size:24px;letter-spacing:1px;text-transform:uppercase}
.cta{position:absolute;right:54px;bottom:34px;background:#FFD23F;color:#111;font-weight:900;font-size:26px;padding:16px 28px;border-radius:14px;box-shadow:0 6px 0 #B45309;z-index:3}
.strike{position:relative;color:#9CA3AF;display:inline-block}.strike:after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:5px;background:#EF4444;transform:rotate(-8deg);border-radius:3px}
.win{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.win .bar{height:30px;background:#e8ecea;display:flex;align-items:center;gap:7px;padding:0 12px}.win .bar i{width:10px;height:10px;border-radius:50%}
.win .bar span{margin-left:12px;font:600 13px Inter;color:#4b5563;background:#fff;border-radius:6px;padding:3px 12px}
.win img{display:block;width:100%}
.spots{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:26px;background:rgba(255,255,255,.08);border:2px solid rgba(255,210,63,.6);border-radius:999px;padding:8px 18px}
</style></head><body>
<script>
const LOGO='<svg viewBox="0 0 32 35"><rect x="3" y="4.8" width="26" height="4.4" rx="2.2" fill="#34C78A"/><rect x="3" y="11.8" width="20" height="4.4" rx="2.2" fill="#6FD8AD"/><rect x="3" y="18.8" width="14" height="4.4" rx="2.2" fill="#B4EBD3"/><rect x="3" y="25.8" width="8" height="4.4" rx="2.2" fill="#FFFFFF"/></svg>';
const BR='<div class="brand">'+LOGO+'<span>TopDividendETFs <i>PRO</i></span></div>';
const WIN=(st)=>`<div class="win" style="${st}"><div class="bar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><span>🔒 topdividendetfspro.com</span></div><img src="../img/pro-screenshot.jpg"></div>`;
document.write(`<div class="c">
 ${WIN('left:600px;top:100px;width:680px;transform:rotate(-3deg)')}
 <div style="position:absolute;right:60px;top:56px;z-index:2;background:#FFD23F;color:#111;font-weight:900;font-size:22px;padding:10px 18px;border-radius:12px;transform:rotate(4deg);box-shadow:0 10px 24px rgba(0,0,0,.4)">160+ income ETFs inside</div>
 <div style="position:absolute;left:0;top:0;width:640px;height:630px;background:linear-gradient(90deg,#050505 82%,rgba(5,5,5,0))"></div>
 <div style="position:absolute;left:54px;top:50px;display:flex;gap:14px;align-items:center"><span class="pill">Black Friday</span><span class="spots">Only <span class="y" style="font-size:34px">7</span> spots</span></div>
 <div style="position:absolute;left:54px;top:132px;font-weight:900;font-size:56px">Lifetime PRO for</div>
 <div style="position:absolute;left:44px;top:185px;font-weight:900;font-size:240px;line-height:1;letter-spacing:-10px" class="y">$67</div>
 <div style="position:absolute;left:58px;top:430px;font-size:30px;font-weight:700;color:#d1d5db"><span class="strike" style="font-weight:900;font-size:40px;margin-right:14px">$97</span>One payment. Yours forever.</div>
 ${BR}<div class="cta">Claim a spot →</div></div>`);
</script></body></html>
