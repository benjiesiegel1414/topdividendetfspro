name: Snapshot Yield & Total Return History

on:
  schedule:
    - cron: "30 11 * * *"   # ~6:30am Central daily — covers your 2x/week update cadence with buffer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Take snapshot
        run: node snapshot-history.js

      - name: Commit and push if changed
        run: |
          git config user.name "history-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to snapshot today."
          else
            git commit -m "Snapshot yield & total return history [skip ci]"
            git push
          fi
