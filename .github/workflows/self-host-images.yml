name: Self-host homepage images (one time)

# Downloads the homepage screenshot and social card from postimg.cc into /img,
# makes a compressed WebP + JPG of the screenshot, commits them, then deletes this workflow.
on:
  push:
    paths:
      - '.github/workflows/self-host-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          set -e
          mkdir -p img
          curl -fsSL --retry 5 --retry-delay 5 -A "Mozilla/5.0" -o /tmp/shot.png "https://i.postimg.cc/4xMLP6sG/Screenshot-2026-04-10-19-43-20.png"
          curl -fsSL --retry 5 --retry-delay 5 -A "Mozilla/5.0" -o img/pro-social-card.png "https://i.postimg.cc/2ynmZy7t/100-Dividend-ETFs-(1).png"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq webp imagemagick >/dev/null
          cwebp -quiet -q 82 -m 6 /tmp/shot.png -o img/pro-screenshot.webp
          convert /tmp/shot.png -strip -quality 84 -interlace JPEG img/pro-screenshot.jpg
          identify /tmp/shot.png img/pro-screenshot.jpg img/pro-social-card.png
          ls -la img
      - name: Commit images and remove this workflow
        run: |
          git config user.name "pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/self-host-images.yml
          git add img
          git commit -m "Self-host homepage screenshot and social card"
          git pull --rebase -q && git push
